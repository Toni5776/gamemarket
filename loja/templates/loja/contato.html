<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato-GameMarket</title>
</head>
<body>
    <header>
        <img src="photo.jpg" alt="erro">
        <h1>Opa</h1>
        <form>
            <input type="search" name="pesquisa" id="pesquisa" placeholder="oq vc quer pesquisar?">
            <button type="submit">Logar</button>
            <button type="submit">Cadstrar</button>
            <button type="submit">🛒</button>

        </form>
    
    
    
    </header>  <!--cabeçalho-->
    <main>
        <h2>contato</h2>
        <p>eae brother! da pra falar com nós por aqui.</p>
        <form action="">
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required>
            <br>
            <label for="telefone">Telefone:</label>
            <input type="number" name="telefone" id="telefone" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="assunto">Assunto:</label>
            <select name="assunto" id="assunto">
                <option value="duvida_pedido">dúvida sobre pedido</option>
                <option value="duvida_produto">dúvida sobre produto</option>
                <option value="critica">Fazer crítica</option>
                <option value="atacado">Diversas peças(atacado)</option>
                <option value="outro">Outro</option>
            </select>
        <br>
        <label for="msg">Mensagem</label>
        <textarea name="msg" id="msg"></textarea>
        <br>
        <label for="opcao_contato">onde quer receber a resposta</label>
        
        <input type="radio" name="email" id="email">
        


        </form>
    
    </main>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
</head>
<body>
    <header>
        <img src="photo.jpg" alt="erro">
        <h1></h1>
        <form>
            <input type="search" name="pesquisa" id="pesquisa" placeholder="oq vc quer pesquisar?">
            <button type="submit">Logar</button>
            <button type="submit">Cadstrar</button>
            <button type="submit">🛒</button>

        </form>
    
    
    
    </header>  <!--cabeçalho-->
    <main>
        <p>Cadastro</p>
        <label for="nome_produto">Nome do produto:</label>
        <input type="text" name="nome_produto" id="nome_produto" required>
        <br>
        <label for="preco_custo">custo do produto</label>
        <input type="text" name="preco_custo" id="preco_custo">
        <br>
        <label for="imagem_produto"></label>
        <input type="file" name="imagem_produto" id="imagem_produto">
        <br>
        <label for="preco_venda"></label>
        <input type="number" name="preco_venda" id="preco_venda">
        <br>
        <label for="qtd_estoque">qtd_estoque</label>
        <input type="number" name="qtd_estoque" id="qtd_estoque">
        <br>
        <label for="tamanho_produto"></label>
        <input type="text" name="tamanho_produto" id="tamanho_produto">
        <br>
        <label for="descricao_produto"></label>
        <textarea name="descricao_produto" id="descricao_produto"></textarea>
        <button type="submit">Cadastrar</button>

       


    </main>      <!--Pricipal.muda-->
    
    
    
    <footer>
        <p>email:</p>
        <a href="a"></a>
        <p>instagram:</p>
        <a href="">A2</a>
        <br>
        <p>Feito por Luís</p>

    </footer>  <!--Rodapé-->
    




</body>


</html>
